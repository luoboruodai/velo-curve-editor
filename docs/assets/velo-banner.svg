<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Velo — shape motion with control</title>
  <desc id="description">Original brand illustration of an editable curve, handles and a derivative line. Not a host screenshot.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191d"/>
      <stop offset="1" stop-color="#24262b"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="curveGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#surface)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <path d="M80 80H1120M80 340H1120" stroke="#ffffff" stroke-opacity=".08"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="78" y="166" fill="#f3f3f1" font-size="104" font-weight="650" letter-spacing="-5">Velo</text>
    <text x="84" y="213" fill="#c5c6ca" font-size="24" letter-spacing="2">SHAPE MOTION. KEEP CONTROL.</text>
    <text x="84" y="254" fill="#858990" font-size="18">值曲线 · 真实速度 · 关键帧</text>
    <g font-size="14" letter-spacing="1.5" fill="#b9bdc5">
      <text x="84" y="316">BEZIER</text>
      <text x="190" y="316">ELASTIC</text>
      <text x="310" y="316">BOUNCE</text>
    </g>
  </g>
  <g transform="translate(570 72)">
    <path d="M0 250H500M0 125H500M0 0V250" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M0 250C95 250 130 125 250 125S405 0 500 0" fill="none" stroke="#39c5cf" stroke-opacity=".26" stroke-width="3"/>
    <path d="M0 250C140 250 165 12 500 12" fill="none" stroke="#f2b35d" stroke-width="5" stroke-linecap="round" filter="url(#curveGlow)"/>
    <path d="M0 250L165 238M500 12L332 12" fill="none" stroke="#d4d6da" stroke-opacity=".55" stroke-width="1.5"/>
    <g fill="#22252a" stroke="#f3f3f1" stroke-width="2">
      <circle cx="165" cy="238" r="8"/>
      <circle cx="332" cy="12" r="8"/>
    </g>
    <g fill="#f3f3f1">
      <rect x="-4" y="246" width="8" height="8" rx="1"/>
      <rect x="496" y="8" width="8" height="8" rx="1"/>
    </g>
    <circle cx="250" cy="98" r="7" fill="#f2b35d" stroke="#fff4df" stroke-width="2"/>
    <path d="M250 98V250" stroke="#f2b35d" stroke-opacity=".3" stroke-dasharray="4 6"/>
  </g>
  <text x="1115" y="385" text-anchor="end" fill="#777d87" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" letter-spacing="1.2">CEP · LOCAL FIRST</text>
</svg>
